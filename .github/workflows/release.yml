name: Release

# Pushing a tag is the whole interface:
#   git tag v1.0.0
#   git push origin v1.0.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    # WPF builds on Windows only. These minutes are free while the repository is public.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Read the version off the tag
        id: version
        shell: pwsh
        run: |
          $number = $env:GITHUB_REF_NAME -replace '^v', ''
          "number=$number" >> $env:GITHUB_OUTPUT

      - name: Publish against an installed runtime
        shell: pwsh
        run: |
          dotnet publish src/LogGrep/LogGrep.csproj `
            -c Release -r win-x64 --self-contained false `
            -p:DebugType=none -p:Version=${{ steps.version.outputs.number }} `
            -o publish/runtime

      - name: Publish with the runtime bundled in
        shell: pwsh
        run: |
          dotnet publish src/LogGrep/LogGrep.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=none -p:Version=${{ steps.version.outputs.number }} `
            -o publish/standalone

      - name: Pack both
        shell: pwsh
        run: |
          $number = '${{ steps.version.outputs.number }}'
          Compress-Archive -Path publish/runtime/* -DestinationPath "LogGrep-$number-win-x64.zip"
          Compress-Archive -Path publish/standalone/* -DestinationPath "LogGrep-$number-win-x64-standalone.zip"
          Get-ChildItem LogGrep-*.zip | Select-Object Name, Length

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem LogGrep-*.zip | ForEach-Object { $_.FullName }
          $notes = 'The plain zip needs the .NET 8 desktop runtime and weighs a few hundred kilobytes. The standalone zip carries the runtime with it and runs on a machine without .NET installed.'
          gh release create $env:GITHUB_REF_NAME $files --title $env:GITHUB_REF_NAME --notes $notes
